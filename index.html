<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học bảng chữ cái tiếng Nhật</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E3%81%82%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<h1>日本語 Học bảng chữ cái tiếng Nhật</h1>
<div class="tabs" id="modes">
  <button data-m="table" class="on">Bảng chữ</button>
  <button data-m="flash">Thẻ ghi nhớ</button>
  <button data-m="quiz">Kiểm tra</button>
  <button data-m="nums">Số đếm</button>
  <button data-m="swt">SWT301</button>
  <button data-m="jpd">JPD133</button>
</div>
<div class="opts" id="scripts">
  <button data-s="hira" class="on">Hiragana</button>
  <button data-s="kata">Katakana</button>
  <button data-s="both">Cả hai</button>
</div>

<section id="table"></section>

<section id="flash" class="hide">
  <div class="panel">
    <div class="big" id="fChar"></div>
    <div id="fAns" class="big" style="font-size:2.2rem;color:var(--accent)"></div>
    <div class="opts" style="justify-content:center;margin-top:14px">
      <button id="fShow">Hiện cách đọc</button>
      <button id="fNext">Chữ tiếp theo</button>
    </div>
  </div>
</section>

<section id="quiz" class="hide">
  <div class="panel">
    <div class="opts" style="justify-content:center">
      <button data-q="choice" class="on">Trắc nghiệm</button>
      <button data-q="type">Gõ romaji</button>
    </div>
    <div class="big" id="qChar"></div>
    <div id="qChoice" class="choices"></div>
    <div id="qType" class="hide">
      <input type="text" id="qInput" autocomplete="off" autocapitalize="off" placeholder="romaji">
      <button id="qGo">Kiểm tra</button>
    </div>
    <div class="msg" id="qMsg"></div>
    <div class="score" id="qScore">Điểm: 0/0</div>
  </div>
</section>
<section id="nums" class="hide">
  <div class="panel">
    <input type="text" inputmode="numeric" id="nIn" placeholder="Nhập số 0–9999" maxlength="4">
    <div class="big" id="nK" style="font-size:2.6rem"></div>
    <div id="nH" style="font-size:1.4rem"></div>
    <div id="nR" style="color:var(--muted);margin-top:4px"></div>
  </div>
  <p class="score">Lưu ý: 4 đọc là yon hoặc shi, 7 đọc là nana hoặc shichi, 0 đọc là zero hoặc rei. Các số 300, 600, 800, 3000, 8000 đọc biến âm.</p>
  <div id="nTable" style="overflow-x:auto"></div>
</section>
<section id="bank" class="hide"></section>
</main>

<script src="data/swt301.js"></script>
<script src="data/jpd133.js"></script>
<script src="js/kana.js"></script>
<script src="js/numbers.js"></script>
<script src="js/ai.js"></script>
<script src="js/bank.js"></script>
<script src="js/translate.js"></script>
<script src="js/app.js"></script>
</body>
</html>
